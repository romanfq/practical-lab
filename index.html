<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erin's Practical Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a lab bench. Level map as a grid of element-style cells; play screens as one centred column with the real exam paper as the hero. */
:root{
  --bench:#EEF3F1; --card:#FFFFFF; --ink:#132238; --muted:#566676; --line:#CFDAD6;
  --accent:#1D5FC2; --accent-soft:#E2ECFB; --accent-ink:#FFFFFF;
  --lilac:#8A4FD6; --lilac-soft:#F1E9FC;
  --ok:#17844A; --ok-soft:#E1F3E8; --bad:#C2392B; --bad-soft:#FBE6E3;
  --paper:#FFFFFF; --paper-line:#C9D3D0; --shadow:0 1px 2px rgba(19,34,56,.08),0 6px 18px rgba(19,34,56,.06);
  /* relaxing rounds: one deliberate stage look, same in both themes */
  --stage:#0A1440; --stage-2:#16236B; --stage-line:#6F86E6; --gold:#F2B33D; --stage-ink:#EEF2FF; --pick:#F28C28;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bench:#0E161E; --card:#15202B; --ink:#E6EDF2; --muted:#9AA9B6; --line:#2A3846;
  --accent:#6AA5FF; --accent-soft:#1A2B45; --accent-ink:#0B1422;
  --lilac:#B996F2; --lilac-soft:#2A2140; --ok:#4CC383; --ok-soft:#14301F; --bad:#FF7B6B; --bad-soft:#3A1A17;
  --paper:#F4F4F1; --paper-line:#3A4855; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bench:#0E161E; --card:#15202B; --ink:#E6EDF2; --muted:#9AA9B6; --line:#2A3846;
  --accent:#6AA5FF; --accent-soft:#1A2B45; --accent-ink:#0B1422;
  --lilac:#B996F2; --lilac-soft:#2A2140; --ok:#4CC383; --ok-soft:#14301F; --bad:#FF7B6B; --bad-soft:#3A1A17;
  --paper:#F4F4F1; --paper-line:#3A4855; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bench);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bench)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:.7em 1.3em;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.5em}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.lilac{background:var(--lilac);color:#fff}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bench);border-bottom:1px solid var(--line);margin-bottom:20px}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.flask{width:26px;height:26px}
.spacer{flex:1}
.pts{display:flex;align-items:baseline;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.pts b{font-family:var(--f-mono);font-size:1.05rem}
.pts span{font-size:.8rem;color:var(--muted)}

/* map */
.hero{display:grid;gap:14px;margin:6px 0 22px}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.how{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem}
.how span{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 12px;min-height:150px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .15s,border-color .15s}
.cell:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.cell[disabled]{cursor:not-allowed;opacity:.5}
.cell .z{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between}
.cell .sym{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1;letter-spacing:-.03em;margin-top:4px}
.cell .nm{font-weight:700;font-size:.95rem;line-height:1.2}
.cell .ms{margin-top:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.cell.relax{background:var(--stage);border-color:var(--stage-2);color:var(--stage-ink)}
.cell.relax .z,.cell.relax .ms{color:#AFC0FF}
.cell.relax .sym{color:var(--gold)}
.cell.done{border-color:var(--ok)}
.cell .chip{position:absolute;right:10px;top:30px;font-size:.7rem;font-family:var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.cell.relax .chip{background:#1E3A2A;color:#7EE2A8}
.ind{height:6px;border-radius:3px;background:linear-gradient(90deg,#D7263D,#F46036,#F9C80E,#9BC53D,#2E9E5B,#1B7FBF,#3D3B9E,#6A2C91);position:relative;margin-top:6px}
.ind i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.cell.relax .ind i{background:#fff}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:.85rem}
.foot .btn{font-size:.85rem;padding:.45em 1em}

/* play */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:1.4rem;font-weight:800}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px}
.steps i{height:6px;flex:1 1 14px;min-width:10px;max-width:46px;border-radius:3px;background:var(--line)}
.steps i.c{background:var(--lilac)} .steps i.d{background:var(--accent)} .steps i.now{background:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tag{font-family:var(--f-mono);font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.sheet{background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;max-height:64vh;overflow:auto;position:relative}
.crop{position:relative;overflow:hidden;width:100%;max-width:100%}
.crop img{position:absolute;left:0;top:0;width:100%;display:block}
.sheet.zoom .crop{width:820px;max-width:none}
.helper+.helper,#helpP:not(:empty)+#helpA:not(:empty){margin-top:10px}
.hl{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--pick) 22%,transparent);border-left:5px solid var(--pick);pointer-events:none}
.tip{font-size:.9rem;background:var(--lilac-soft);border-radius:8px;padding:8px 12px}
label.lab{font-weight:700;font-size:.95rem}
textarea,input[type=number]{font:inherit;color:var(--ink);background:var(--bench);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msbox{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.msimg{background:#fff;border:1px solid var(--paper-line);border-radius:8px;overflow-x:auto}
.msimg img{display:block;width:100%;min-width:520px}
.marks{display:flex;flex-wrap:wrap;gap:8px}
.mk{min-width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bench);font-family:var(--f-mono);font-weight:700;font-size:1.05rem;cursor:pointer}
.mk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.yours{white-space:pre-wrap;background:var(--bench);border-radius:8px;padding:10px 12px;font-size:.95rem}

/* flashcard */
.bonus-h{display:flex;align-items:center;gap:10px}
.bonus-h .tag{background:var(--lilac-soft);color:var(--lilac)}
.scene{perspective:1400px;width:100%}
.fc{position:relative;width:100%;min-height:320px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px 22px 64px;display:flex;flex-direction:column;gap:12px;overflow:auto;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.face.front{background:linear-gradient(160deg,var(--lilac-soft),var(--card) 60%)}
.face.back{transform:rotateY(180deg)}
.face .qq{font-family:var(--f-display);font-size:clamp(1.15rem,3.2vw,1.45rem);font-weight:700;line-height:1.3}
.face .qq .mk2{font-family:var(--f-mono);color:var(--lilac);white-space:nowrap}
.face ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.face li small{display:block;color:var(--muted);font-size:.82rem}
.face .note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--lilac);padding-left:10px}
.flipbtn{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--lilac);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.flipbtn svg{width:22px;height:22px}
.selfev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.selfev label{display:block;margin-bottom:6px}
.selfev input{max-width:140px}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}

/* millionaire stage */
.stage{background:radial-gradient(120% 90% at 50% 0%,var(--stage-2),var(--stage) 70%);color:var(--stage-ink);border-radius:18px;padding:18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.stage .eyebrow{color:#AFC0FF}
.lifelines{display:flex;gap:10px;flex-wrap:wrap}
.ll{width:64px;height:44px;border-radius:50%;border:2px solid var(--stage-line);background:rgba(255,255,255,.04);color:var(--stage-ink);font-family:var(--f-mono);font-weight:700;font-size:.8rem;cursor:pointer;display:grid;place-items:center}
.ll svg{width:22px;height:22px}
.ll[disabled]{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.lozenge{border:2px solid var(--stage-line);border-radius:999px/40px;padding:16px 24px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));font-size:1.08rem;text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--stage-line);border-radius:999px;padding:12px 18px;background:rgba(10,20,64,.6);color:var(--stage-ink);cursor:pointer;min-height:54px}
.opt b{color:var(--gold);font-family:var(--f-mono)}
.opt:hover:not([disabled]){background:rgba(111,134,230,.2)}
.opt.sel{background:var(--pick);border-color:var(--pick);color:#1A0E00}
.opt.sel b{color:#1A0E00}
.opt.right{background:#1F9D55;border-color:#1F9D55;color:#fff} .opt.right b{color:#fff}
.opt.wrong{background:#B03A2E;border-color:#B03A2E;color:#fff} .opt.wrong b{color:#fff}
.opt.gone{visibility:hidden}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-family:var(--f-mono);font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid #3A4C9A;color:#AFC0FF}
.ladder span.now{background:var(--gold);color:#1A0E00;border-color:var(--gold)}
.ladder span.ok{border-color:#1F9D55;color:#7EE2A8}
.ladder span.no{border-color:#B03A2E;color:#FFB4AA}
.helper{border:1px dashed var(--stage-line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px;align-items:end;height:120px}
.aud div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-family:var(--f-mono);font-size:.75rem}
.aud div i{display:block;width:70%;background:var(--gold);border-radius:4px 4px 0 0}
.verdict{border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.07)}
.small{font-size:.8rem;color:#AFC0FF}

/* summary */
.done-panel{text-align:center;justify-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,9vw,4.2rem);letter-spacing:-.03em}
.indwide{width:min(100%,420px);height:14px;border-radius:7px}
.indwide i{height:24px;top:-5px;width:6px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.opts{grid-template-columns:1fr}.panel{padding:14px}.fc{min-height:380px}.lozenge{border-radius:18px}}
@media (prefers-reduced-motion:reduce){.fc,.cell{transition:none}}
</style>

</head>

/* ---------- level runner ---------- */
let run=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildItems(L){
  if(L.kind==="relax")return shuffle(L.items).map(m=>{const order=shuffle(m.opts.map((_,j)=>j));
    return Object.assign({},m,{opts:order.map(j=>m.opts[j]),ans:m.ans.map(a=>order.indexOf(a)).sort((x,y)=>x-y)})});
  // keep each multi-part question together and in paper order; shuffle the questions
  const groups=[],byKey={};
  L.items.filter(x=>x.t==="q").forEach(q=>{const k=q.exam+"|"+q.q.slice(0,2);if(!byKey[k]){byKey[k]=[];groups.push(byKey[k])}byKey[k].push(q)});
  const sg=shuffle(groups),qs=sg.flat(),cards=shuffle(L.items.filter(x=>x.t==="card"));
  const n=qs.length,m=cards.length,slots=new Set();
  // bonus cards only go between whole questions, never between parts of one question
  const bounds=[];let acc=0;sg.slice(0,-1).forEach(gp=>{acc+=gp.length;bounds.push(acc)});
  cards.forEach((_,c)=>{const t=(c+1)*n/(m+1)+(Math.random()*2-1);
    const free=bounds.filter(x=>!slots.has(x));
    if(free.length){slots.add(free.reduce((best,x)=>Math.abs(x-t)<Math.abs(best-t)?x:best))}
    else if(!slots.has(n))slots.add(n);
    else{let s=Math.min(n-1,Math.max(1,Math.round(t)));while(slots.has(s)&&s<n-1)s++;slots.add(s)}});
  const pos=[...slots].sort((a,b)=>a-b),out=[];let c=0;
  qs.forEach((q,i)=>{out.push(q);while(c<cards.length&&pos[c]===i+1)out.push(cards[c++])});
  while(c<cards.length)out.splice(out.length-1,0,cards[c++]);
  return out}
function startLevel(i){run={li:i,idx:0,score:0,res:[],items:buildItems(LEVELS[i]),ll:{fifty:false,phone:false,aud:false}};renderItem()}
function steps(){return `<div class="steps" aria-hidden="true">${run.items.map((it,k)=>`<i class="${k<run.idx?(it.t==="card"?"c":"d"):k===run.idx?"now":""}"></i>`).join("")}</div>`}
function head(){const L=LEVELS[run.li];return `<div class="bar"><button class="btn ghost" id="back" type="button">← Map</button><h2>${esc(L.title)}</h2><span class="spacer"></span><span class="pts"><b>${run.score}</b><span>/ ${maxOf(L)}</span></span></div>${steps()}`}
function bindBack(){$("#back").onclick=()=>renderMap()}
function next(got){run.res.push(got);run.score+=got;run.idx++;if(run.idx>=run.items.length)finish();else renderItem()}
function renderItem(){

}

    <div class="sheet" id="sheet"><div class="crop" id="crop" style="aspect-ratio:${it.W}/${it.end}">
      <img src="${it.img}" alt="Exam paper ${esc(it.exam)} question ${esc(it.q)} with its context" id="qimg">
      <div class="hl" style="top:${(100*(it.y-6)/it.end).toFixed(3)}%;height:${(100*lh/it.end).toFixed(3)}%"></div></div></div>
    <div class="row"><span class="eyebrow" style="flex:1;min-width:0">Answer the highlighted part, Question ${esc(it.q)}. Scroll up inside the paper for the context.</span><button class="btn ghost" id="zoom" type="button" aria-pressed="false" style="padding:.4em 1em;font-size:.85rem">Bigger text</button></div>
    ${it.paper?`<div class="tip">This part needs a pen. Do it on paper (or describe what you would draw), then check the mark scheme.</div>`:""}
    <label class="lab" for="ans">Your answer</label>
    <textarea id="ans" placeholder="Write your answer as you would in the exam…"></textarea>
    <div class="row"><button class="btn" id="check" type="button">Show the mark scheme</button><button class="btn ghost" id="skip" type="button">Skip (0 marks)</button></div>
    <div id="msArea"></div></article>`;
  bindBack();
  const img=$("#qimg"),sheet=$("#sheet");
  const go=()=>{const c=$("#crop");sheet.scrollTop=Math.max(0,c.clientHeight*(it.y/it.end)-90)};
  if(img.complete)go();else img.onload=go;
  $("#skip").onclick=()=>next(0);
  $("#zoom").onclick=()=>{const z=sheet.classList.toggle("zoom");$("#zoom").setAttribute("aria-pressed",z);$("#zoom").textContent=z?"Fit to width":"Bigger text";go()};
  $("#check").onclick=()=>{
    const a=$("#ans").value.trim();$("#check").disabled=true;$("#skip").hidden=true;$("#ans").readOnly=true;
    let pick=null;
    $("#msArea").innerHTML=`<div class="msbox"><span class="eyebrow">Official mark scheme · ${esc(it.exam)} · ${esc(it.q)}</span>
      <div class="msimg"><img src="${it.ms}" alt="Mark scheme for question ${esc(it.q)}"></div>
      ${a?"":`<div class="tip">No written answer this time. Mark yourself on what you would have written.</div>`}
      <span class="lab" id="mkl">How many marks did you earn? (max ${it.marks})</span>
      <div class="marks" role="group" aria-labelledby="mkl">${Array.from({length:it.marks+1},(_,k)=>`<button class="mk" type="button" aria-pressed="false" data-k="${k}">${k}</button>`).join("")}</div>
      <div class="row"><button class="btn" id="nx" type="button" disabled>Next</button></div></div>`;
    $("#msArea").querySelectorAll(".mk").forEach(b=>b.onclick=()=>{pick=+b.dataset.k;$("#msArea").querySelectorAll(".mk").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#nx").disabled=false});
    $("#nx").onclick=()=>next(pick);
    $("#msArea").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  };
}

/* bonus flashcard */
function renderCard(it){
  app.innerHTML=head()+`<article class="panel">
    <div class="bonus-h"><span class="tag">Bonus card</span><span class="eyebrow">${esc(it.exam)} · Q${esc(it.q)}</span></div>
    <div class="scene"><div class="fc" id="fc">
      <div class="face front"><span class="eyebrow">Question</span>
        <div class="qq">${esc(it.front)} <span class="mk2">(${it.marks})</span></div>
        <span class="eyebrow" style="margin-top:auto">Answer in your head or out loud, then flip.</span>
        <button class="flipbtn" type="button" data-f aria-label="Flip card to see the answer">${ICON.flip}</button></div>
      <div class="face back" aria-hidden="true"><span class="eyebrow">Mark scheme · ${it.marks} mark${it.marks>1?"s":""}</span>
        ${it.pts.filter(p=>/:$/.test(p[0])&&!p[1]).map(p=>`<b>${esc(p[0])}</b>`).join("")}<ul>${it.pts.filter(p=>!(/:$/.test(p[0])&&!p[1])).map(p=>`<li>${esc(p[0])}${p[1]?`<small>${esc(p[1])}</small>`:""}</li>`).join("")}</ul>
        ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
        <button class="flipbtn" type="button" data-f aria-label="Flip card back to the question">${ICON.flip}</button></div>
    </div></div>
    <div class="selfev"><div><label class="lab" for="sev">Score yourself (0 to ${it.marks})</label>
      <input type="number" id="sev" min="0" max="${it.marks}" step="1" inputmode="numeric" placeholder="0–${it.marks}"></div>
      <button class="btn lilac" id="bank" type="button">Bank bonus</button></div>
    <div class="err" id="err" aria-live="polite"></div></article>`;
  bindBack();
  const fc=$("#fc");let seen=false;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fc.classList.toggle("flip");seen=true;const f=fc.classList.contains("flip");
    fc.querySelector(".front").setAttribute("aria-hidden",f);fc.querySelector(".back").setAttribute("aria-hidden",!f)});
  $("#bank").onclick=()=>{const v=$("#sev").value.trim(),n=Number(v);
    if(!seen){$("#err").textContent="Flip the card first to compare with the mark scheme.";return}
    if(v===""||!Number.isInteger(n)||n<0||n>it.marks){$("#err").textContent=`Enter a whole number from 0 to ${it.marks}.`;return}
    next(n)};
}

/* relaxing round */
function rnd(a,b){return a+Math.random()*(b-a)}
function renderMcq(it){
  const L=LEVELS[run.li],k=run.idx;
  const sel=new Set(),gone=new Set();let locked=false;
  const ladder=run.items.map((x,j)=>`<span class="${j===k?"now":j<k?(run.res[j]===x.marks?"ok":"no"):""}">Q${j+1} · ${x.marks} pt${x.marks>1?"s":""}</span>`).join("");
  app.innerHTML=`<div class="bar"><button class="btn ghost" id="back" type="button">← Map</button><h2>${esc(L.title.replace("Relaxing round: ",""))}</h2><span class="spacer"></span><span class="pts"><b>${run.score}</b><span>/ ${maxOf(L)}</span></span></div>
  <section class="stage">
    <div class="row"><span class="eyebrow">Relaxing round · ${esc(it.exam)} · Q${esc(it.q)}</span><span class="spacer"></span>
      <div class="lifelines">
        <button class="ll" id="l50" type="button" ${run.ll.fifty?"disabled":""} aria-label="Fifty fifty: remove two wrong answers">50:50</button>
        <button class="ll" id="lph" type="button" ${run.ll.phone?"disabled":""} aria-label="Phone a friend">${ICON.phone}</button>
        <button class="ll" id="lau" type="button" ${run.ll.aud?"disabled":""} aria-label="Ask the audience">${ICON.aud}</button>
      </div></div>
    <div class="ladder">${ladder}</div>
    <div class="lozenge">${esc(it.stem)}${it.ans.length>1?`<div class="small" style="margin-top:6px">Choose ${it.ans.length} answers.</div>`:""}</div>
    <div class="opts">${it.opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><b>${"ABCDE"[j]}:</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="helpP"></div><div id="helpA"></div>
    <div class="row"><button class="btn" id="final" type="button" disabled style="background:var(--gold);color:#1A0E00">Final answer</button>
      <span class="small">Lifelines are simulated, once each per round. Your friend and the audience can be wrong!</span></div>
    <div id="verdict"></div>
  </section>`;
  bindBack();
  const opts=[...app.querySelectorAll(".opt")];
  const paint=()=>{opts.forEach(b=>b.classList.toggle("sel",sel.has(+b.dataset.j)));$("#final").disabled=sel.size!==it.ans.length};
  opts.forEach(b=>b.onclick=()=>{if(locked)return;const j=+b.dataset.j;
    if(sel.has(j))sel.delete(j);else{if(it.ans.length===1)sel.clear();if(sel.size<it.ans.length)sel.add(j)}paint()});
  const wrong=()=>it.opts.map((_,j)=>j).filter(j=>!it.ans.includes(j)&&!gone.has(j));
  const live=()=>it.opts.map((_,j)=>j).filter(j=>!gone.has(j));
  $("#l50").onclick=()=>{if(run.ll.fifty||locked)return;run.ll.fifty=true;$("#l50").disabled=true;
    const w=wrong().sort(()=>Math.random()-.5).slice(0,2);w.forEach(j=>{gone.add(j);sel.delete(j);opts[j].classList.add("gone");opts[j].disabled=true});paint()};
  $("#lph").onclick=()=>{if(run.ll.phone||locked)return;run.ll.phone=true;$("#lph").disabled=true;
    const p=gone.size?0.85:0.7;let picks=[];
    it.ans.forEach(a=>{if(Math.random()<p)picks.push(a);else{const w=wrong().filter(x=>!picks.includes(x));picks.push(w.length?w[Math.floor(Math.random()*w.length)]:a)}});
    picks=[...new Set(picks)].sort((a,b)=>a-b);const sure=Math.round(rnd(55,85));
    $("#helpP").innerHTML=`<div class="helper"><span class="eyebrow">Phone a friend</span><div>“Hmm… I think it's <b>${picks.map(x=>"ABCDE"[x]).join(" and ")}</b>. I'm about ${sure}% sure.”</div><span class="small">Simulated friend: right most of the time, not always.</span></div>`};
  $("#lau").onclick=()=>{if(run.ll.aud||locked)return;run.ll.aud=true;$("#lau").disabled=true;
    const L2=live();const w={};L2.forEach(j=>w[j]=rnd(4,22));const boost=gone.size?rnd(45,70):rnd(30,60);
    it.ans.forEach(a=>{if(!gone.has(a))w[a]+=boost/it.ans.length*(Math.random()<0.85?1:0.3)});
    const s=L2.reduce((a,j)=>a+w[j],0);let ps=L2.map(j=>[j,Math.round(100*w[j]/s)]);
    const diff=100-ps.reduce((a,x)=>a+x[1],0);ps[0][1]+=diff;const top=Math.max(...ps.map(x=>x[1]));
    $("#helpA").innerHTML=`<div class="helper"><span class="eyebrow">Ask the audience</span><div class="aud">${ps.map(([j,v])=>`<div><span>${v}%</span><i style="height:${Math.max(4,Math.round(78*v/top))}%"></i><b>${"ABCDE"[j]}</b></div>`).join("")}</div><span class="small">Simulated audience vote.</span></div>`};
  $("#final").onclick=()=>{if(locked)return;locked=true;$("#final").hidden=true;
    let got=0;sel.forEach(j=>{if(it.ans.includes(j))got++});
    opts.forEach(b=>{const j=+b.dataset.j;b.disabled=true;b.classList.remove("sel");if(it.ans.includes(j))b.classList.add("right");else if(sel.has(j))b.classList.add("wrong")});
    const last=run.idx===run.items.length-1;
    $("#verdict").innerHTML=`<div class="verdict"><b>${got===it.marks?"Correct!":got>0?"Partly right.":"Not this time."}</b> ${got} / ${it.marks} point${it.marks>1?"s":""}.<div class="small" style="margin-top:4px">Mark scheme: ${esc(it.ms)}</div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="nx" type="button" style="background:var(--gold);color:#1A0E00">${last?"Finish round":"Next question"}</button></div>`;
    $("#nx").onclick=()=>next(got)};
}

/* ---------- level complete ---------- */
function finish(){
  const L=LEVELS[run.li],mx=maxOf(L),s=run.score,p=prog[L.id]||{};
  prog[L.id]={done:true,best:Math.max(s,p.best||0),last:s};save();updTotal();
  const pc=pct(s,mx),msg=pc>=85?"Outstanding, that is grade 9 territory.":pc>=70?"Strong work. A couple of points to tidy up.":pc>=50?"Good progress. Replay to push it higher.":"Worth another go. Read each mark scheme carefully.";
  const nextI=run.li+1<LEVELS.length?run.li+1:null;
  window.scrollTo(0,0);
  app.innerHTML=`<article class="panel done-panel">
    <span class="eyebrow">${esc(L.title)} complete</span>
    <div class="big mono">${s}<span style="color:var(--muted);font-size:.5em"> / ${mx}</span></div>
    <div class="ind indwide" role="img" aria-label="Score ${pc}% on the universal indicator scale"><i style="left:${pc}%"></i></div>
    <span class="eyebrow">Score on the universal indicator scale · ${pc}%</span>
    <p style="margin:0;max-width:46ch">${msg} ${s<(p.best||0)?`Your best is still ${p.best}.`:""}</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="again" type="button">Play again</button>
      <button class="btn ghost" id="map" type="button">Level map</button>
      ${nextI!==null?`<button class="btn" id="nxl" type="button">Next: ${esc(LEVELS[nextI].title.replace("Relaxing round: ","Relax · "))}</button>`:""}</div>
  </article>`;
  $("#again").onclick=()=>startLevel(run.li);$("#map").onclick=renderMap;
  if(nextI!==null)$("#nxl").onclick=()=>startLevel(nextI);
}
$("#home").onclick=renderMap;
renderMap();
</script>
